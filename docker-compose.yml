version: "3.9"

services:
  acronym-nginx:
    image: nginx:alpine
    container_name: acronym-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./dashboard/dist:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  acronym-api:
    build: ./api
    container_name: acronym-api
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      # Point at PgBouncer (127.0.0.1:6432 / acronym-pgbouncer:6432) when the
      # pgbouncer profile is enabled; direct PostgreSQL otherwise.
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET:-}
      - SESSION_IDLE_MINUTES=${SESSION_IDLE_MINUTES:-720}
      - SESSION_ABSOLUTE_HOURS=${SESSION_ABSOLUTE_HOURS:-168}
      - TRUST_PROXY=true
      - ENV_SECRET=${ENV_SECRET}
      - ADMIN_USERS=${ADMIN_USERS}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://systems.acronym.sk}
      - SYSTEMS_API_INTERNAL_UPSTREAM=${SYSTEMS_API_INTERNAL_UPSTREAM:-acronym-api:3000}
      - SYSTEMS_ATTESTATION_SECRET=${SYSTEMS_ATTESTATION_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - acronym-nginx

  # V4 Phase 1: PgBouncer sidecar (opt-in via `--profile pgbouncer`).
  # All application code connects through the pooler, never directly to
  # PostgreSQL: transaction pooling, 20 server connections, pool size 5.
  # Point PGBOUNCER_UPSTREAM_DATABASE_URL at the real PostgreSQL and set
  # DATABASE_URL=postgresql://user:pass@acronym-pgbouncer:6432/dbname
  # (or 127.0.0.1:6432 from the host).
  acronym-pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: acronym-pgbouncer
    restart: unless-stopped
    profiles:
      - pgbouncer
    environment:
      - DATABASE_URL=${PGBOUNCER_UPSTREAM_DATABASE_URL}
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_DB_CONNECTIONS=20
      - DEFAULT_POOL_SIZE=5
      - RESERVE_POOL_SIZE=1
      - SERVER_IDLE_TIMEOUT=300
      - AUTH_TYPE=scram-sha-256
    ports:
      - "127.0.0.1:6432:6432"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  acronym-certbot:
    image: certbot/certbot
    container_name: acronym-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    profiles:
      - certbot
    entrypoint: >
      certbot certonly --webroot
      --webroot-path=/var/www/certbot
      --email ${CERTBOT_EMAIL:-admin@acronym.sk}
      --agree-tos
      --no-eff-email
      -d project.acronym.sk
